# docker-compose.prod.yml — HAULOPS di satu VPS (Postgres + backend + frontend + HTTPS).
#
# Jalankan dari root repo:
#   cp deploy/.env.example deploy/.env      # lalu isi nilainya
#   docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d --build
#   (tambahkan `--profile https` bila server tidak punya Nginx/panel sendiri)
#
# Detail langkah: docs/DEPLOYMENT_VPS.md

name: haulops

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: haulops
      POSTGRES_USER: haulops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haulops -d haulops"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Tidak ada `ports:` — database hanya bisa diakses dari container lain.

  server:
    build:
      context: ${SRC_DIR:-.}/scaf/packages/server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4001
      # DIRECT_URL wajib ada karena schema.prisma memakai directUrl (warisan Supabase);
      # di VPS keduanya menunjuk ke database yang sama.
      DATABASE_URL: postgresql://haulops:${POSTGRES_PASSWORD}@db:5432/haulops
      DIRECT_URL: postgresql://haulops:${POSTGRES_PASSWORD}@db:5432/haulops
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di deploy/.env}
      JWT_EXPIRES_IN: 8h
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD di deploy/.env}
      ADMIN_BRANCH_KODE: ${ADMIN_BRANCH_KODE:-HQ}
      ADMIN_BRANCH_NAMA: ${ADMIN_BRANCH_NAMA:-Kantor Pusat}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ${SRC_DIR:-.}/scaf/packages/web
      dockerfile: Dockerfile.prod
      args:
        # Kosong = frontend memanggil /api di origin yang sama (diteruskan nginx ke backend).
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Hanya di localhost. Dipakai reverse proxy host (mis. Nginx aaPanel) atau Caddy.
      - "127.0.0.1:${WEB_PORT:-8580}:80"
    volumes:
      # Menimpa config bawaan image agar /api diteruskan ke backend.
      - ${SRC_DIR:-.}/deploy/nginx.vps.conf:/etc/nginx/conf.d/default.conf:ro

  # Opsional: hanya untuk server TANPA Nginx/panel di port 80/443.
  # Aktifkan dengan: docker compose --profile https up -d
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Isi nama domain (mis. haulops.contoh.com) untuk HTTPS otomatis,
      # atau ":80" untuk HTTP saja (tanpa domain / uji coba).
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ${SRC_DIR:-.}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
